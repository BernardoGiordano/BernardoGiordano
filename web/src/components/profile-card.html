<profile-form *if="editing" class="edit-open" (saved)="close()" (cancelled)="close()"></profile-form>

<div *else class="{{ canEdit ? 'edit-target' : '' }}">
  <!-- Phone and tablet: the rail is a masthead, so the picture sits beside the
       name instead of over it. From `lg` up it is the column's own width again,
       which is where the 148px square of the design lands. -->
  <div class="flex items-center gap-4 lg:block">
    <!-- The name is a `p`, not a heading: the page inside the shell owns the h1,
         and the rail is beside every one of them. -->
    <div class="portrait size-[60px] shrink-0 lg:aspect-square lg:h-auto lg:w-full">
      <div class="size-full bg-surface">
        <!-- `sizes` is the two boxes above: the rail's own width from `lg`, and
             the 60px square beside the name below it. Without it the browser
             assumes the full viewport and picks the largest variant for a
             thumbnail. `|| null` drops the attribute rather than writing an
             empty one when the picture has a single variant. -->
        <img
          *if="profile?.avatarUrl"
          [src]="profile?.avatarUrl ?? ''"
          [srcset]="profile?.avatarSrcset || null"
          sizes="(min-width: 1024px) 252px, 60px"
          [alt]="profile?.name ?? ''"
          width="296"
          height="296"
          class="size-full object-cover"
        />
        <span
          *else
          class="flex size-full items-center justify-center text-[20px] font-medium text-muted lg:text-[42px]"
        >
          {{ initials }}
        </span>
      </div>
    </div>

    <div class="min-w-0 lg:mt-4">
      <p class="display text-[19px] text-ink lg:text-[25px]">{{ profile?.name ?? '' }}</p>
      <p class="mt-1.5 text-[13px] leading-snug text-ink/55">{{ profile?.headline ?? '' }}</p>
    </div>
  </div>

  <p *if="profile?.bio" class="mt-4 text-[13.5px] leading-relaxed text-ink/78 text-pretty">
    {{ profile?.bio ?? '' }}
  </p>

  <dl class="mt-4 flex flex-col gap-1.5 text-[13px] text-ink/62">
    <div *if="profile?.current" class="flex items-center gap-2">
      <svg viewBox="0 0 24 24" class="size-[15px] shrink-0 text-accent" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path [d]="icon('briefcase')"></path>
      </svg>
      <dd class="truncate">{{ profile?.current ?? '' }}</dd>
    </div>
    <div *if="profile?.location" class="flex items-center gap-2">
      <svg viewBox="0 0 24 24" class="size-[15px] shrink-0 text-accent" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path [d]="icon('mapPin')"></path>
      </svg>
      <dd class="truncate">{{ profile?.location ?? '' }}</dd>
    </div>
  </dl>

  <!-- A light rather than a sentence in a box: the dot is the whole signal, and
       the ring around it is what keeps a 7px circle from reading as a bullet. -->
  <p *if="profile?.available" class="mt-2.5 flex items-center gap-2 text-[12.5px] text-ink/62">
    <span class="ms-1 size-[7px] shrink-0 rounded-full bg-[var(--site-open)] ring-3 ring-[color-mix(in_srgb,var(--site-open)_18%,transparent)]"></span>
    {{ profile?.available ?? '' }}
  </p>

  <!-- What is being worked on this month. It lives here rather than further down
       the rail so that the pencil below edits it: as a separate block it was the
       one line on the site that showed in edit mode, sat inside no dashed
       outline, and answered no click. In edit mode the row is kept even when the
       sentence is empty, because a field you cannot see is a field you cannot
       discover is empty. -->
  <div *if="profile?.now || canEdit" class="mt-4 hidden lg:block">
    <hr class="rule-tight mb-3.5" />
    <p class="eyebrow">{{ t('site.now') }}</p>
    <p *if="profile?.now" class="mt-2 text-[13px] leading-relaxed text-ink/70">{{ profile?.now ?? '' }}</p>
    <p *else class="mt-2 text-[13px] leading-relaxed text-ink/40 italic">{{ t('site.nowEmpty') }}</p>
  </div>

  <button *if="canEdit" type="button" (click)="open()" class="btn btn-quiet mt-4">
    <svg viewBox="0 0 24 24" class="size-[13px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path [d]="icon('pencil')"></path>
    </svg>
    {{ t('site.edit') }}
  </button>
</div>
