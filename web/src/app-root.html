<!-- Announced rather than taken: a reload throws away whatever is half-written in
     an editor, and only the visitor knows whether that matters. -->
<div *if="newBuild" class="build-notice" role="status">
  <span>{{ t('site.updated') }}</span>
  <button type="button" class="btn btn-primary" (click)="reload()">{{ t('site.reload') }}</button>
</div>

<main class="min-h-screen text-ink"></main>
