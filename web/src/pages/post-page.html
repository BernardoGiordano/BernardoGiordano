<article>
  <a
    href="/blog"
    class="inline-flex items-center gap-1.5 text-[11.5px] tracking-[0.1em] text-ink/55 uppercase transition-colors hover:text-brand"
  >
    <svg viewBox="0 0 24 24" class="size-[13px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path [d]="icon('arrowLeft')"></path>
    </svg>
    {{ t('blog.back') }}
  </a>

  <p *if="isLoading" class="py-6 text-[13px] text-muted">{{ t('site.loading') }}</p>

  <p *if="missing" class="py-6 text-[13px] text-muted">{{ t('blog.notFound') }}</p>

  <post-editor
    *if="editing"
    class="edit-open mt-5"
    [.record]="post"
    (saved)="saved($event)"
    (cancelled)="close()"
  ></post-editor>

  <!-- One measure for the words and the whole column for the pictures: 64ch is
       the line length the body is set for, and an image is the only thing on the
       page allowed to be wider than it. -->
  <div *if="post && !editing" class="mt-8">
    <!-- The one editable thing on the site that had the tools and not the box.
         A post is edited from its own page, so the head of the post is what the
         dashed outline belongs round. -->
    <div class="flex items-start justify-between gap-3 {{ canEdit ? 'edit-target' : '' }}">
      <div class="min-w-0 max-w-[64ch]">
        <h1 class="display text-[30px] text-ink sm:text-[38px]">{{ post?.title ?? '' }}</h1>

        <p class="mt-3 flex flex-wrap items-center gap-x-2.5 gap-y-1 text-[12.5px] text-ink/52">
          <span>{{ date(post?.publishedOn ?? '') }}</span>
          <span *if="post?.readingMinutes">·</span>
          <span *if="post?.readingMinutes">
            {{ t('blog.readingTime', { count: post?.readingMinutes ?? 0 }) }}
          </span>
          <span *if="post?.draft" class="chip chip-on">{{ t('blog.draft') }}</span>
        </p>
      </div>

      <row-tools
        *if="canEdit"
        class="edit-tools mt-1"
        [.can-move]="false"
        [.busy]="busy"
        (edit)="open()"
        (remove)="discard()"
      ></row-tools>
    </div>

    <p *if="errorMessage" class="edit-error mt-4" role="alert">{{ errorMessage }}</p>

    <!-- A banner, so a crop is the right answer here: it is the one image on the
         page whose shape the layout decides rather than the photograph. -->
    <!-- The banner is the content column, which the shell caps at 688px: the
         1060px container less its padding, the 252px rail and the gap between
         them. Under `lg` the rail is not beside it and the column is the
         container. -->
    <img
      *if="post?.coverUrl"
      [src]="post?.coverUrl ?? ''"
      [srcset]="post?.coverSrcset || null"
      sizes="(min-width: 1060px) 688px, (min-width: 1024px) calc(100vw - 372px), (min-width: 640px) calc(100vw - 64px), calc(100vw - 40px)"
      [alt]="post?.title ?? ''"
      loading="lazy"
      class="mt-9 max-h-[300px] w-full rounded-[var(--site-radius)] object-cover"
    />

    <md-body class="prose-site mt-9" [.markdown]="post?.body ?? ''"></md-body>

    <div *if="post?.tags.length" class="mt-12">
      <hr class="grad-rule" />
      <div class="mt-5 flex flex-wrap items-center gap-1.5">
        <span class="section-label me-2">{{ t('blog.tagged') }}</span>
        <a *for="name of post?.tags ?? []; key: name" [href]="'/blog?tag=' + name" class="chip">{{ name }}</a>
      </div>
    </div>
  </div>
</article>
