<section>
  <div *if="canEdit" class="mb-6 flex items-center gap-3">
    <button *if="!isCreating" type="button" class="btn btn-quiet" (click)="openNew()">
      + {{ t('projects.addProject') }}
    </button>
    <p *if="errorMessage" class="edit-error" role="alert">{{ errorMessage }}</p>
  </div>

  <project-editor
    *if="isCreating"
    class="edit-open mb-8"
    (saved)="close()"
    (cancelled)="close()"
  ></project-editor>

  <p *if="isLoading && !rows.length" class="py-6 text-[13px] text-muted">{{ t('site.loading') }}</p>

  <p *if="failed" class="flex flex-wrap items-center gap-3 py-6 text-[13px] text-muted" role="alert">
    {{ t('site.failed') }}
    <button type="button" class="btn btn-quiet" (click)="retry()">{{ t('site.retry') }}</button>
  </p>

  <!-- No cards, no borders, no grid. A title at 25px and one muted line of
       facts under the description: the type is the whole layout, and the fading
       rule between two rows is the only graphic on the page. -->
  <!-- `card-link row` is off in edit mode on purpose. `.card-link` grows a
       transparent anchor over the whole row, which in edit mode meant the dashed
       box — the thing that says "click me to edit" — opened GitHub instead; and
       `.row`'s hover wash under the box's own hover was two washes answering one
       pointer. The row padding drops by the box's inset so the list does not
       reflow when the handles appear. -->
  <ul class="rule-list flex flex-col">
    <li *for="project of rows; key: project.id" class="{{ canEdit ? 'py-4' : 'card-link row py-7' }}">
      <project-editor
        *if="isEditing(project)"
        class="edit-open"
        [.record]="project"
        (saved)="close()"
        (cancelled)="close()"
      ></project-editor>

      <div *else class="{{ canEdit ? 'edit-target' : '' }}">
        <div class="min-w-0">
          <div class="flex flex-wrap items-baseline gap-x-3 gap-y-2">
            <!-- Mono, because the name of a project is the name of a
                 repository: the chips under it are already set in that face,
                 and the one thing on the row that is a proper noun of the
                 command line should not be the one thing set as prose. -->
            <h2 class="display-mono text-[19px] text-ink sm:text-[22px]">
              <!-- `.card-target` is what makes the whole row clickable: the
                   anchor grows a transparent layer over it, so the pointer is
                   a pointer everywhere and the click lands here. -->
              <a
                *if="cardUrl(project)"
                [href]="cardUrl(project)"
                target="_blank"
                rel="noopener noreferrer"
                class="card-target transition-colors hover:text-brand"
              >
                {{ project.name }}
              </a>
              <span *else>{{ project.name }}</span>
            </h2>

            <!-- Only a status worth reading: every row is active until it says
                 otherwise, and a label on all four of them is a column of noise
                 rather than a fact about any one. -->
            <span
              *if="project.status !== 'active'"
              class="text-[11px] tracking-[0.1em] uppercase {{ statusClasses(project) }}"
            >
              {{ statusLabel(project) }}
            </span>

            <!-- One right-aligned group, and in edit mode the only one. The
                 star button is gone from here: what it invited is now the chip
                 that carries the count, in the line below with the other facts
                 GitHub reported. A filled button at the end of every row was
                 the loudest element on the page for an action almost nobody
                 takes, and the count beside it was the least legible part of
                 it. -->
            <div *if="canEdit" class="edit-tools ms-auto">
              <button
                *if="project.repo"
                type="button"
                class="btn-icon"
                (click)="refresh(project)"
                [?disabled]="isBusy(project)"
                [aria-label]="t('projects.refreshStats')"
                [title]="t('projects.refreshStats')"
              >
                <svg viewBox="0 0 24 24" class="size-[13px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path [d]="icon('refreshCw')"></path>
                </svg>
              </button>

              <row-tools
                [.can-up]="canMoveUp(project)"
                [.can-down]="canMoveDown(project)"
                [.busy]="isBusy(project)"
                (edit)="open(project)"
                (move-up)="move(project, -1)"
                (move-down)="move(project, 1)"
                (remove)="discard(project)"
              ></row-tools>
            </div>
          </div>

          <p class="mt-2.5 max-w-[66ch] text-[14px] leading-relaxed text-ink/72 text-pretty">
            {{ project.description }}
          </p>

          <!-- Chips, not a sentence. The line this replaces was platforms, an
               em dash and what GitHub reported, held together by middots — one
               string built in JavaScript because the separators depended on
               which parts existed. A chip needs no separator, so the facts are
               facts again: the plain ones as they were authored, the counted
               ones in the mono face with tabular figures and one small coloured
               mark each, which is the whole difference between a number worth
               reading and a label worth reading.

               The star chip is the exception twice over: its mark is filled
               rather than stroked, because a hollow star means "not starred",
               and it is a link. The invitation used to be a button at the top
               of the row; it is now the count itself, and it grows under the
               pointer to say so. -->
          <div class="mt-3 flex flex-wrap items-center gap-1.5">
            <span *for="tag of tags(project); key: tag" class="chip chip-mono">{{ tag }}</span>

            <a
              *if="starCount(project)"
              [href]="repoUrl(project)"
              target="_blank"
              rel="noopener noreferrer"
              class="chip chip-mono chip-cta"
              [title]="starLabel(project)"
              [aria-label]="starLabel(project)"
            >
              <svg viewBox="0 0 24 24" class="chip-mark mark-stars" fill="currentColor" aria-hidden="true">
                <path [d]="icon('star')"></path>
              </svg>
              {{ starCount(project) }}
            </a>

            <span
              *for="metric of metrics(project); key: metric.key"
              class="chip chip-mono"
              [title]="metric.label"
            >
              <svg viewBox="0 0 24 24" class="chip-mark {{ metric.mark }}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path [d]="icon(metric.icon)"></path>
              </svg>
              {{ metric.text }}
            </span>
          </div>
        </div>
      </div>
    </li>
  </ul>

  <div *if="rows.length && githubUrl" class="mt-8">
    <hr class="grad-rule mb-5" />
    <a
      [href]="githubUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center gap-1.5 text-[12.5px] text-ink/58 transition-colors hover:text-brand"
    >
      {{ t('projects.more') }}
      <svg viewBox="0 0 24 24" class="size-[13px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path [d]="icon('arrowUpRight')"></path>
      </svg>
    </a>
  </div>

  <p *if="!isLoading && !failed && !rows.length" class="py-6 text-[13px] text-muted">{{ t('projects.empty') }}</p>
</section>
